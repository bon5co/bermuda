# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!go.sum"
    - "!**/testdata/**"
    - "!assets/**"
  path_instructions:
    - path: "internal/**/*.go"
      instructions: >-
        This is a single-binary Go tool that supervises its own subprocesses; it has no systemd
        dependencies by design. Flag anything that assumes an external supervisor, a daemon, or a
        service manager. SQLite is accessed through modernc.org/sqlite (no cgo) — flag any change
        that reintroduces a cgo dependency.
    - path: "cmd/**/*.go"
      instructions: >-
        Command entry points. Flag unhandled errors, silent failure paths, and any output that a
        calling agent would have to parse but is not stable.
  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true
